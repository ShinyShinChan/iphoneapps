<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MeasureCalc</title>
<style>
  :root{
    --bg:#0f1920;
    --panel:#15242d;
    --panel2:#1c2e39;
    --line:#304651;
    --text:#f3f6f7;
    --muted:#9fb0b9;
    --accent:#d6a646;
    --accent2:#f0cc7a;
    --danger:#bd6b62;
    --shadow:0 10px 30px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,Roboto,Arial,sans-serif;color:var(--text)}
  body{display:flex;justify-content:center}
  .app{width:min(100%,520px);min-height:100vh;padding:18px 16px 22px}
  .brand{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
  .brand-icon{
    width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,var(--accent2),var(--accent));
    position:relative;box-shadow:var(--shadow);flex:0 0 auto
  }
  .brand-icon:before{
    content:"";position:absolute;left:9px;top:11px;width:24px;height:18px;border:3px solid #182832;border-radius:5px
  }
  .brand-icon:after{
    content:"";position:absolute;left:27px;top:7px;width:14px;height:5px;background:#e9eef0;
    box-shadow:3px 0 0 #e9eef0,6px 0 0 #e9eef0
  }
  .brand h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.2px}
  .brand p{font-size:12px;margin:2px 0 0;color:var(--muted);letter-spacing:.4px}
  .display{
    background:linear-gradient(180deg,#172832,#13212a);
    border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px
  }
  .expression{min-height:20px;color:var(--muted);font-size:13px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .measurement{font-size:34px;font-weight:800;line-height:1.1;text-align:right;margin-top:8px;letter-spacing:.2px}
  .measurement small{font-size:16px;color:var(--muted);font-weight:650}
  .mm{
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px;padding-top:12px;
    border-top:1px solid var(--line);color:var(--muted);font-size:13px
  }
  .mm strong{color:var(--accent2);font-size:20px;letter-spacing:.3px}
  .controls{
    background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:var(--shadow)
  }
  .quick-frac-wrap{margin-bottom:10px}
  .quick-frac-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .select-label{font-size:11px;color:var(--muted);margin:0 0 5px 2px;text-transform:uppercase;letter-spacing:.8px}
  button{
    width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;
    font:inherit;font-weight:750;outline:none
  }
  .quick-frac{height:50px;background:#243a45;color:var(--accent2);font-size:17px}
  .quick-frac:active{transform:translateY(1px);filter:brightness(1.1)}
  .convert{height:48px;background:linear-gradient(180deg,#e1b85f,#c99836);color:#15202a;border-color:#e8c777;font-size:15px}
  .convert-wide{margin-top:9px}
  .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .key{height:58px;font-size:21px;box-shadow:inset 0 -1px 0 rgba(255,255,255,.03)}
  .key:active{transform:translateY(1px);filter:brightness(1.1)}
  .op{background:#223945;color:var(--accent2);font-size:24px}
  .eq{background:var(--accent);color:#14202a;border-color:#e0b75e;font-size:26px}
  .clear{background:#3a2c2a;color:#f1c3bd;border-color:#6a4540}
  .back{font-size:19px;color:#d7e0e4}
  .zero{grid-column:span 2}
  .hint{text-align:center;color:#6f858f;font-size:11px;margin:11px 6px 0;line-height:1.45}
  @media(max-height:690px){
    .app{padding-top:10px;padding-bottom:10px}
    .brand{margin-bottom:8px}.brand-icon{width:40px;height:40px;border-radius:11px}
    .display{padding:12px;margin-bottom:9px}.measurement{font-size:30px}.mm{margin-top:9px;padding-top:8px}
    .controls{padding:10px}.quick-frac-wrap{margin-bottom:8px}.key{height:50px}.hint{margin-top:7px}
  }
</style>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">

<style>
html{background:var(--bg,#0f1214)}
@supports (padding: max(0px)){body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}}
</style>
</head>
<body>
<main class="app">
  <header class="brand">
    <div class="brand-icon" aria-hidden="true"></div>
    <div>
      <h1>MeasureCalc</h1>
      <p>Fraction &amp; millimeter calculator</p>
    </div>
  </header>

  <section class="display" aria-live="polite">
    <div id="expression" class="expression">Ready</div>
    <div id="measurement" class="measurement">0 <small>in</small></div>
    <div class="mm">
      <span>Metric conversion</span>
      <strong id="mmResult">—</strong>
    </div>
  </section>

  <section class="controls">
    <div class="quick-frac-wrap">
      <div class="select-label">Quick fractions</div>
      <div class="quick-frac-row">
        <button class="quick-frac" data-frac-ticks="8">1/2</button>
        <button class="quick-frac" data-frac-ticks="4">1/4</button>
        <button class="quick-frac" data-frac-ticks="2">1/8</button>
        <button class="quick-frac" data-frac-ticks="1">1/16</button>
      </div>
      <button id="convertBtn" class="convert convert-wide">Convert to mm</button>
    </div>

    <div class="pad">
      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key op" data-action="operator" data-value="+">+</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key op" data-action="operator" data-value="-">−</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key eq" data-action="equals">=</button>

      <button class="key clear" data-action="clear">C</button>
      <button class="key zero" data-digit="0">0</button>
      <button class="key back" data-action="back">⌫</button>
    </div>
    <div class="hint">Enter whole inches, then tap 1/2, 1/4, 1/8, or 1/16 as needed. Fraction taps stack automatically, reduce instantly, and carry into whole inches.</div>
  </section>
</main>

<script>
(() => {
  const measurementEl = document.getElementById('measurement');
  const expressionEl = document.getElementById('expression');
  const mmEl = document.getElementById('mmResult');

  let whole = '';
  let frac = 0;
  let accumulator = null;
  let pendingOp = null;
  let resultTicks = null;
  let expressionLeft = '';
  let justEvaluated = false;

  const gcd = (a,b) => {
    a = Math.abs(a); b = Math.abs(b);
    while (b) [a,b] = [b,a%b];
    return a || 1;
  };

  const formatTicks = (ticks, includeUnit = true) => {
    const sign = ticks < 0 ? '−' : '';
    const abs = Math.abs(ticks);
    const w = Math.floor(abs / 16);
    const r = abs % 16;
    let text = '';
    if (r === 0) {
      text = `${sign}${w}`;
    } else {
      const g = gcd(r,16);
      const n = r/g, d = 16/g;
      text = w ? `${sign}${w} ${n}/${d}` : `${sign}${n}/${d}`;
    }
    return includeUnit ? `${text} in` : text;
  };

  const currentTicks = () => {
    if (resultTicks !== null && justEvaluated) return resultTicks;
    return (parseInt(whole || '0', 10) * 16) + frac;
  };

  const perform = (a, op, b) => op === '+' ? a + b : a - b;

  const render = () => {
    const ticks = currentTicks();
    const formatted = formatTicks(ticks, false);
    measurementEl.innerHTML = `${formatted} <small>in</small>`;

    if (pendingOp && accumulator !== null) {
      expressionEl.textContent = `${formatTicks(accumulator)} ${pendingOp === '+' ? '+' : '−'} …`;
    } else if (!justEvaluated) {
      expressionEl.textContent = 'Ready';
    }
  };

  const startNewEntryIfNeeded = () => {
    if (justEvaluated && pendingOp === null) {
      whole = '';
      frac = 0;
      resultTicks = null;
      justEvaluated = false;
      expressionLeft = '';
      mmEl.textContent = '—';
    }
  };

  document.querySelectorAll('[data-digit]').forEach(btn => {
    btn.addEventListener('click', () => {
      startNewEntryIfNeeded();
      if (whole.length >= 6) return;
      const d = btn.dataset.digit;
      if (whole === '0') whole = d;
      else whole += d;
      render();
    });
  });



  document.querySelectorAll('[data-frac-ticks]').forEach(btn => {
    btn.addEventListener('click', () => {
      startNewEntryIfNeeded();

      const addTicks = parseInt(btn.dataset.fracTicks, 10);
      const baseWhole = parseInt(whole || '0', 10);

      let totalTicks = (baseWhole * 16) + frac + addTicks;
      whole = String(Math.floor(totalTicks / 16));
      frac = totalTicks % 16;

      // Keep a clean entry: don't show a leading zero whole number for pure fractions.
      if (whole === '0') whole = '';

      mmEl.textContent = '—';
      render();
    });
  });

  document.querySelectorAll('[data-action="operator"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const op = btn.dataset.value;
      const value = currentTicks();

      if (accumulator !== null && pendingOp !== null && !justEvaluated) {
        accumulator = perform(accumulator, pendingOp, value);
      } else {
        accumulator = value;
      }

      pendingOp = op;
      expressionLeft = formatTicks(accumulator);
      whole = '';
      frac = 0;
      resultTicks = null;
      justEvaluated = false;
      mmEl.textContent = '—';
      render();
    });
  });

  const equals = () => {
    if (accumulator === null || pendingOp === null) return;
    const rhs = currentTicks();
    const lhs = accumulator;
    const op = pendingOp;
    const answer = perform(lhs, op, rhs);

    expressionEl.textContent = `${formatTicks(lhs)} ${op === '+' ? '+' : '−'} ${formatTicks(rhs)} =`;
    resultTicks = answer;
    accumulator = null;
    pendingOp = null;
    whole = '';
    frac = 0;
    justEvaluated = true;
    render();
  };

  document.querySelectorAll('[data-action="equals"]').forEach(btn => btn.addEventListener('click', equals));

  document.querySelector('[data-action="clear"]').addEventListener('click', () => {
    whole = '';
    frac = 0;
    accumulator = null;
    pendingOp = null;
    resultTicks = null;
    expressionLeft = '';
    justEvaluated = false;
    expressionEl.textContent = 'Ready';
    mmEl.textContent = '—';
    render();
  });

  document.querySelector('[data-action="back"]').addEventListener('click', () => {
    if (justEvaluated) {
      whole = '';
      frac = 0;
      resultTicks = null;
      justEvaluated = false;
      expressionEl.textContent = 'Ready';
      mmEl.textContent = '—';
    } else if (whole.length) {
      whole = whole.slice(0,-1);
    } else if (frac !== 0) {
      frac = 0;
    }
    render();
  });

  document.getElementById('convertBtn').addEventListener('click', () => {
    const ticks = currentTicks();
    const inches = ticks / 16;
    const mm = inches * 25.4;
    let formatted = mm.toFixed(4).replace(/\.?0+$/,'');
    mmEl.textContent = `${formatted} mm`;
  });

  render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
}
</script>
</body>
</html>
